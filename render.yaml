services:
  - type: web
    name: embed-downloader-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8788"
      # Allow any Vercel preview/prod origin; tighten later if needed
      - key: FRONTEND_ORIGIN
        value: "*"
